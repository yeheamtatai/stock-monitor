<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>米株モニター</title>
<style>
body{margin:0;background:#f6f7f9;color:#202124;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:1000px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:24px;margin:0}.user,.small{font-size:13px;color:#666}.actions,.add{display:flex;gap:8px;margin:18px 0}.add input{width:180px;padding:9px;border:1px solid #ccc;border-radius:7px;text-transform:uppercase}button{border:0;border-radius:7px;padding:9px 14px;cursor:pointer;background:#202124;color:#fff}button.secondary,.delete{background:#e8eaed;color:#202124}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:12px 10px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{font-size:13px;color:#666;background:#fafafa}.symbol{font-weight:700}.drag{cursor:grab;color:#999;margin-right:8px}.delete{padding:5px 9px;font-size:12px}.pos{color:#07883f}.neg{color:#c5221f}.login{margin:50px auto;text-align:center;max-width:450px;background:#fff;padding:30px;border-radius:12px}.mobile-note{display:none}@media(max-width:650px){.wrap{padding:12px}.add,.desktop-only{display:none}.mobile-note{display:block}th,td{padding:10px 6px;font-size:13px}}
</style>
</head>
<body>
<div id="login" class="login"><h1>米株モニター</h1><p>Googleログインして銘柄リストをPC・スマホで共有します。</p><button id="loginBtn">Googleでログイン</button></div>
<div id="app" class="wrap" style="display:none">
<div class="top"><div><h1>米株モニター</h1><div id="user" class="user"></div></div><button id="logout" class="secondary">ログアウト</button></div>
<div class="actions"><button id="refresh">株価を取得</button></div>
<div class="add"><input id="symbolInput" maxlength="12" placeholder="銘柄コード 例: NVDA"><button id="addBtn">銘柄を追加</button></div>
<div id="message" class="small"></div><div class="mobile-note small">スマホでは閲覧のみ。銘柄の追加・削除・並べ替えはPCで行ってください。</div>
<table><thead><tr><th>銘柄</th><th>現在値</th><th>前日終値</th><th>前日比</th><th>取得時刻</th><th class="desktop-only"></th></tr></thead><tbody id="rows"></tbody></table>
<p class="small">「株価を取得」を押した時点の取得値です。自動更新はしません。</p>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyC_mp1WFGY7H6ufEO6Y1T7rlQ_JDf7WNUs",authDomain:"stock-monitor-9ec36.firebaseapp.com",projectId:"stock-monitor-9ec36",storageBucket:"stock-monitor-9ec36.firebasestorage.app",messagingSenderId:"364353865488",appId:"1:364353865488:web:a6f27c173fc59de42dc795",measurementId:"G-VHPG09E7G2"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();
const PROXY="https://stock-proxy.yeheamtatai.workers.dev",DEFAULTS=["NVDU","MUU","SOXL","NUGT","BABX"];let uid=null,tickers=[];
const $=id=>document.getElementById(id),money=v=>v==null?"-":Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:4}),pct=v=>v==null?"-":(Number(v)>=0?"+":"")+Number(v).toFixed(2)+"%";
function msg(s){$("message").textContent=s}
function render(){const r=$("rows");r.innerHTML="";tickers.forEach((s,i)=>{const tr=document.createElement("tr");tr.dataset.index=i;tr.draggable=true;tr.innerHTML='<td><span class="drag desktop-only">☰</span><span class="symbol">'+s+'</span></td><td class="price">-</td><td class="prev">-</td><td class="change">-</td><td class="time">-</td><td class="desktop-only"><button class="delete" data-i="'+i+'">削除</button></td>';r.appendChild(tr)});r.querySelectorAll(".delete").forEach(b=>b.onclick=async()=>{tickers.splice(Number(b.dataset.i),1);await save();render()});[...r.children].forEach(tr=>{tr.ondragstart=e=>e.dataTransfer.setData("text/plain",tr.dataset.index);tr.ondragover=e=>e.preventDefault();tr.ondrop=async e=>{e.preventDefault();const f=Number(e.dataTransfer.getData("text/plain")),t=Number(tr.dataset.index);if(f===t)return;const x=tickers.splice(f,1)[0];tickers.splice(t,0,x);await save();render()}})}
async function save(){if(uid)await setDoc(doc(db,"users",uid),{tickers:tickers,updatedAt:Date.now()})}
async function load(){const s=await getDoc(doc(db,"users",uid));tickers=s.exists()&&Array.isArray(s.data().tickers)?s.data().tickers:DEFAULTS.slice();if(!s.exists())await save();render()}
async function refresh(){if(!tickers.length)return;msg("株価を取得中...");try{const r=await fetch(PROXY+"/quotes?codes="+encodeURIComponent(tickers.join(",")),{cache:"no-store"}),j=await r.json();tickers.forEach((s,i)=>{const tr=$("rows").children[i],d=(j.data||{})[s];if(!d){tr.querySelector(".price").textContent="取得失敗";return}tr.querySelector(".price").textContent=money(d.ld);tr.querySelector(".prev").textContent=money(d.p);const c=tr.querySelector(".change");c.textContent=money(d.ch)+" ("+pct(d.chp)+")";c.className="change "+(Number(d.ch)>=0?"pos":"neg");tr.querySelector(".time").textContent=d.t?new Date(d.t).toLocaleString():"-"});msg("取得完了")}catch(e){msg("取得エラー: "+e.message)}}
$("loginBtn").onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){msg("ログインエラー: "+e.message)}};$("logout").onclick=()=>signOut(auth);$("refresh").onclick=refresh;
$("addBtn").onclick=async()=>{let s=$("symbolInput").value.trim().toUpperCase();if(!s)return;if(tickers.includes(s)){msg("すでに登録されています");return}if(tickers.length>=50){msg("最大50銘柄です");return}tickers.push(s);$("symbolInput").value="";await save();render();msg(s+" を追加しました")};$("symbolInput").onkeydown=e=>{if(e.key==="Enter")$("addBtn").click()};
onAuthStateChanged(auth,async u=>{if(!u){$("login").style.display="block";$("app").style.display="none";return}uid=u.uid;$("login").style.display="none";$("app").style.display="block";$("user").textContent=(u.displayName||"")+" ("+(u.email||"")+")";try{await load();await refresh()}catch(e){msg("初期化エラー: "+e.message)}});
</script></body></html>
