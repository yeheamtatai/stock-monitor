<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>米株取得テスト</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:30px auto;padding:0 16px}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border-bottom:1px solid #ddd;padding:9px;text-align:right}th:first-child,td:first-child{text-align:left}button{padding:10px 18px}pre{background:#f5f5f5;padding:12px;white-space:pre-wrap}</style></head><body><h1>米株リアルタイム取得テスト</h1><p>NVDU / MUU / SOXL / UGLD / BABX</p><button id="run">株価を取得</button><span id="status"></span><table><thead><tr><th>銘柄</th><th>現在値</th><th>前日終値</th><th>前日比</th><th>時刻</th><th>状態</th></tr></thead><tbody id="tbody"></tbody></table><h3>診断情報</h3><pre id="diag">未実行</pre><script>
const PROXY="https://stock-proxy.yeheamtatai.workers.dev", S=["NVDU","MUU","SOXL","UGLD","BABX"];
const n=v=>v==null?"-":Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:4});
const p=v=>v==null?"-":(Number(v)>=0?"+":"")+Number(v).toFixed(2)+"%";
const t=v=>v?new Date(v).toLocaleString():"-";
document.getElementById("run").onclick=async()=>{let st=document.getElementById("status"),tb=document.getElementById("tbody"),dg=document.getElementById("diag");tb.innerHTML="";dg.textContent="取得中...";st.textContent=" 取得中...";try{let r=await fetch(PROXY+"/quotes?codes="+encodeURIComponent(S.join(",")),{cache:"no-store"}),x=await r.text(),j;try{j=JSON.parse(x)}catch(e){throw Error("中継サーバーからJSON以外が返りました。HTTP "+r.status+"\n"+x.slice(0,1000))}if(!r.ok||j.code!==0)throw Error("HTTP "+r.status+" / API code="+j.code+" / "+JSON.stringify(j.msg)+"\n"+JSON.stringify(j,null,2));for(const s of S){let d=(j.data||{})[s],tr=document.createElement("tr");tr.innerHTML=d?"<td><b>"+s+"</b></td><td>"+n(d.ld)+"</td><td>"+n(d.p)+"</td><td>"+n(d.ch)+" ("+p(d.chp)+")</td><td>"+t(d.t)+"</td><td>"+(d.ts??"-")+"</td>":"<td><b>"+s+"</b></td><td colspan=5>データなし</td>";tb.appendChild(tr)}dg.textContent="中継サーバー：正常\nHTTP："+r.status+"\niTick code："+j.code+"\n取得銘柄："+Object.keys(j.data||{}).join(", ");st.textContent=" 完了"}catch(e){st.textContent=" エラー";dg.textContent=String(e.stack||e)}};</script></body></html>
